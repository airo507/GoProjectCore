volumes:
  data_db:

services:
  postgres:
    image: postgres:16-alpine3.21
    restart: always
    command: >
      --log_statement=all
    ports:
      - "25432:5432"
    volumes:
      - "data_db:/var/lib/postgresql/data"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
  migration:
    build:
      dockerfile: ./build/goose.Dockerfile
    restart: on-failure
    command: >
      goose postgres up
    volumes:
      - "./migrations:/migrations"
    environment:
      GOOSE_DBSTRING: "dbname=postgres user=postgres password=postgres host=postgres sslmode=disable"
